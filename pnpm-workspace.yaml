packages:
  - 'packages/*'

nodeLinker: hoisted
# Copy workspace packages during pnpm deploy:
injectWorkspacePackages: true

# Dependencies must be older than one week:
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@knaw-huc/*'
  # TODO: remove
  - openseadragon@6.1.1
  - react-aria-components@1.22.1
  - react-aria@3.53.1

allowBuilds:
  msw: true
